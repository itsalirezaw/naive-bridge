name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: for script in install.sh install-local.sh build-bundle.sh; do bash -n "$script"; done
      - name: Python tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile Python
        run: python3 -m compileall -q naivebridge tools tests
